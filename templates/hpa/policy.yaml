{{- if .Values.HPA.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auto-generate-hpa
  annotations:
    policies.kyverno.io/title: Auto-Generate HPA
    policies.kyverno.io/category: Autoscaling
spec:
  validationFailureAction: {{ title .Values.policyEnforcement }}
  background: false
  rules:
    - name: generate-hpa-for-deployments
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  {{ .Values.HPA.targetLabelKey }}: "{{ .Values.HPA.targetLabelValue }}"
      generate:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        # Escaped Kyverno variables so Helm ignores them
        name: '{{ "{{request.object.metadata.name}}" }}-hpa'
        namespace: '{{ "{{request.namespace}}" }}'
        synchronize: true
        data:
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: '{{ "{{request.object.metadata.name}}" }}'
            minReplicas: {{ .Values.HPA.min }}
            maxReplicas: {{ .Values.HPA.max }}
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 80
{{- end }}